<section id="gallery" class="section gallery-section">
  <div class="container">
    <header class="section-header">
      <h2 class="section-title">Our Work Gallery</h2>
      <p class="section-subtitle">Tap any photo to view it larger.</p>
    </header>

    <!-- Optional simple filters (no "browse" / no upload) -->
    <div class="gallery-controls" aria-label="Gallery filters">
      <button class="filter-btn is-active" type="button" data-filter="all">All</button>
      <button class="filter-btn" type="button" data-filter="exterior">Exterior</button>
      <button class="filter-btn" type="button" data-filter="interior">Interior</button>
      <button class="filter-btn" type="button" data-filter="deck">Deck</button>
    </div>

    <div class="gallery-grid" id="galleryGrid">
      <!-- Deck (ONLY ONE deck image example) -->
      <figure class="gallery-item" data-category="deck">
        <button class="gallery-card" type="button"
          data-full="assets/gallery/deck-1.jpg"
          aria-label="Open photo: Deck cleaning">
          <img loading="lazy" src="assets/gallery/deck-1.jpg" alt="Deck cleaning result" />
        </button>
      </figure>

      <!-- Exterior examples -->
      <figure class="gallery-item" data-category="exterior">
        <button class="gallery-card" type="button"
          data-full="assets/gallery/exterior-1.jpg"
          aria-label="Open photo: Exterior cleaning">
          <img loading="lazy" src="assets/gallery/exterior-1.jpg" alt="Exterior cleaning result" />
        </button>
      </figure>

      <figure class="gallery-item" data-category="exterior">
        <button class="gallery-card" type="button"
          data-full="assets/gallery/exterior-2.jpg"
          aria-label="Open photo: Exterior wash">
          <img loading="lazy" src="assets/gallery/exterior-2.jpg" alt="Exterior wash result" />
        </button>
      </figure>

      <!-- Interior examples -->
      <figure class="gallery-item" data-category="interior">
        <button class="gallery-card" type="button"
          data-full="assets/gallery/interior-1.jpg"
          aria-label="Open photo: Interior cleaning">
          <img loading="lazy" src="assets/gallery/interior-1.jpg" alt="Interior cleaning result" />
        </button>
      </figure>

      <figure class="gallery-item" data-category="interior">
        <button class="gallery-card" type="button"
          data-full="assets/gallery/interior-2.jpg"
          aria-label="Open photo: Interior detail">
          <img loading="lazy" src="assets/gallery/interior-2.jpg" alt="Interior detail result" />
        </button>
      </figure>
    </div>
  </div>

  <!-- Lightbox modal -->
  <div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-label="Image viewer">
    <div class="lightbox-backdrop" data-close="true"></div>

    <div class="lightbox-panel" role="document">
      <button class="lightbox-close" type="button" aria-label="Close image viewer" data-close="true">✕</button>

      <img id="lightboxImg" alt="" />
    </div>
  </div>
</section>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Our Work Gallery | Cleantek Pressure Washing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- ✅ ABSOLUTE PATHS -->
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>

<section id="gallery" class="section gallery-section">
  <div class="container">
    <header class="section-header">
      <h1 class="section-title">Our Work Gallery</h1>
      <p class="section-subtitle">Tap any photo to view it larger.</p>
    </header>

    <div class="gallery-controls">
      <button class="filter-btn is-active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="exterior">Exterior</button>
      <button class="filter-btn" data-filter="interior">Interior</button>
      <button class="filter-btn" data-filter="deck">Deck</button>
    </div>

    <div class="gallery-grid" id="galleryGrid">

      <!-- DECK (single image) -->
      <figure class="gallery-item" data-category="deck">
        <button class="gallery-card" data-full="/assets/gallery/deck-1.jpg">
          <img src="/assets/gallery/deck-1.jpg" alt="Deck cleaning result">
        </button>
      </figure>

      <!-- EXTERIOR -->
      <figure class="gallery-item" data-category="exterior">
        <button class="gallery-card" data-full="/assets/gallery/exterior-1.jpg">
          <img src="/assets/gallery/exterior-1.jpg" alt="Exterior cleaning result">
        </button>
      </figure>

      <figure class="gallery-item" data-category="exterior">
        <button class="gallery-card" data-full="/assets/gallery/exterior-2.jpg">
          <img src="/assets/gallery/exterior-2.jpg" alt="Exterior wash result">
        </button>
      </figure>

      <!-- INTERIOR -->
      <figure class="gallery-item" data-category="interior">
        <button class="gallery-card" data-full="/assets/gallery/interior-1.jpg">
          <img src="/assets/gallery/interior-1.jpg" alt="Interior cleaning result">
        </button>
      </figure>

      <figure class="gallery-item" data-category="interior">
        <button class="gallery-card" data-full="/assets/gallery/interior-2.jpg">
          <img src="/assets/gallery/interior-2.jpg" alt="Interior detail result">
        </button>
      </figure>

    </div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <div class="lightbox-backdrop" data-close></div>
    <div class="lightbox-panel">
      <button class="lightbox-close" data-close>✕</button>
      <img id="lightboxImg" alt="">
    </div>
  </div>
</section>

<!-- ✅ ABSOLUTE PATH -->
<script src="/scripts.js"></script>
</body>
</html>
